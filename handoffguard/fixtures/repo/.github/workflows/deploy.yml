name: deploy-website
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.RIYA_PAT }}
      REPO: club/website
    steps:
      - name: fetch
        run: python scripts/deploy.py fetch
      - name: push-tag
        run: python scripts/deploy.py push-tag
